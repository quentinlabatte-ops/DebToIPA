name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-device:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DebToIPA.xcodeproj \
            -scheme "deb-to-ipa-app"

      - name: Build
        run: |
          xcodebuild build \
            -project DebToIPA.xcodeproj \
            -scheme "deb-to-ipa-app" \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned .ipa (for TrollStore-style sideloading)
        run: |
          APP_PATH="DerivedData/Build/Products/Debug-iphoneos/DebToIPA.app"
          mkdir -p ipa_root/Payload
          cp -R "$APP_PATH" ipa_root/Payload/
          (cd ipa_root && zip -rq ../DebToIPA.ipa Payload)

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebToIPA-unsigned-ipa
          path: DebToIPA.ipa

  ui-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DebToIPA.xcodeproj \
            -scheme "deb-to-ipa-app"

      - name: Run XCUITests on iOS Simulator
        run: |
          set -o pipefail

          DEVICE_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "Using simulator $DEVICE_UDID"

          xcodebuild test \
            -project DebToIPA.xcodeproj \
            -scheme "deb-to-ipa-app" \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            CODE_SIGNING_ALLOWED=NO
