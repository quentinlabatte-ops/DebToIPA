name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-device:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DebToIPA.xcodeproj \
            -scheme "deb-to-ipa-app"

      - name: Build
        run: |
          xcodebuild build \
            -project DebToIPA.xcodeproj \
            -scheme "deb-to-ipa-app" \
            -destination "generic/platform=iOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned .ipa (for TrollStore-style sideloading)
        run: |
          APP_PATH="DerivedData/Build/Products/Debug-iphoneos/DebToIPA.app"
          mkdir -p ipa_root/Payload
          cp -R "$APP_PATH" ipa_root/Payload/
          (cd ipa_root && zip -rq ../DebToIPA.ipa Payload)

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebToIPA-unsigned-ipa
          path: DebToIPA.ipa

  simulator-smoke-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DebToIPA.xcodeproj \
            -scheme "deb-to-ipa-app"

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project DebToIPA.xcodeproj \
            -scheme "deb-to-ipa-app" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Boot simulator, install and launch the app
        run: |
          set -e

          DEVICE_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          sys.exit(1)
          ")
          echo "Using simulator $DEVICE_UDID"

          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

          APP_PATH=$(find DerivedData/Build/Products -maxdepth 2 -name "DebToIPA.app" -print -quit)
          echo "Installing $APP_PATH"
          xcrun simctl install "$DEVICE_UDID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_UDID" net.sourceloc.DebToIPA

          echo "Waiting 5s to check the app doesn't immediately crash..."
          sleep 5

          if xcrun simctl spawn "$DEVICE_UDID" launchctl list | grep -q net.sourceloc.DebToIPA; then
            echo "App still running 5s after launch - no immediate crash"
          else
            echo "App is NOT running 5s after launch - it likely crashed on launch"
            xcrun simctl spawn "$DEVICE_UDID" log show --last 1m --predicate 'process == "DebToIPA"' || true
            exit 1
          fi
